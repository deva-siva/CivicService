name: smart_grievance
description: AI-Assisted Smart Grievance & Civic Issue Resolution Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.7.10
  google_sign_in: ^6.2.1

  # HTTP & Storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # State Management
  provider: ^6.1.1

  # Location & Maps
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.0

  # Image
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1

  # Notifications
  flutter_local_notifications: ^18.0.0

  # UI
  fl_chart: ^0.66.2
  introduction_screen: ^3.1.12
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.0
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.0

  # Utils
  intl_phone_number_input: ^0.7.5
  permission_handler: ^11.3.1
  connectivity_plus: ^7.1.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.0
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_gen_runner: ^5.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
